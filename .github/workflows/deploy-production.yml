name: Controlled Vercel Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orchid-one-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::Missing GitHub Actions secret VERCEL_DEPLOY_HOOK."
            exit 1
          fi
          case "$VERCEL_DEPLOY_HOOK" in
            https://api.vercel.com/v1/integrations/deploy/*) ;;
            *)
              echo "::error::VERCEL_DEPLOY_HOOK is not a valid Vercel deploy hook URL."
              exit 1
              ;;
          esac

      - name: Trigger Vercel production deployment
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "$VERCEL_DEPLOY_HOOK"
