<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5a285f">
  <title>You're offline | Orchid One</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fcf9f8;color:#302334;font:16px/1.6 Inter,Arial,sans-serif}.card{width:min(100%,420px);padding:32px;border:1px solid #eadfea;border-radius:18px;background:#fff;text-align:center;box-shadow:0 18px 55px #4a12540d}.mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 20px;border-radius:16px;background:#5a285f;color:#fff;font-size:28px;font-weight:700}.muted{color:#756b77;font-size:14px}button{margin-top:14px;padding:12px 18px;border:0;border-radius:9px;background:#5a285f;color:#fff;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">O</div>
    <h1>You're offline</h1>
    <p class="muted">Orchid One needs an internet connection to securely load your workspace. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
